<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Password Change OTP</title>
</head>
<body style="font-family: Arial, sans-serif; color: #333; line-height: 1.6;">
<div style="max-width: 560px; margin: 20px auto; padding: 24px;
                border: 1px solid #e5e7eb; border-radius: 8px;">
    <h2>Password Change Request</h2>
    <p>We received a request to change your password.</p>
    <p>Use the following OTP to change your password:</p>
    <div style="margin: 24px 0; padding: 16px; text-align: center;
                    background-color: #f3f4f6; border-radius: 6px;">
        <strong style="font-size: 28px; letter-spacing: 6px;"
                th:text="${otp}">
            123456
        </strong>
    </div>
    <p>
        This OTP is valid for
        <strong th:text="${expiresInMinutes}">5</strong>
        minutes.
    </p>
    <p>If you did not request this, please ignore this email.</p>
    <p>Regards,<br>Docmind Team</p>
</div>
</body>
</html>
