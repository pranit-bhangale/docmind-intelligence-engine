spring:
  application:
    name: docmind-intelligence-engine
  autoconfigure:
    exclude:
      - org.springframework.ai.model.ollama.autoconfigure.OllamaEmbeddingAutoConfiguration
  threads:
    virtual:
      enabled: true
  # Database Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: DocmindPool
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        multi_tenancy: SCHEMA
  # Flyway Migration Configuration
  flyway:
    enabled: true
    locations:
      - classpath:db/migration/common
    table: flyway_schema_history
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false
  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 5s
  modulith:
    moments:
      enabled: false
  # Java Mail Sender Configuration
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    protocol: ${MAIL_PROTOCOL}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  # AI Configuration
  ai:
    retry:
      max-attempts: 1     # IMPORTANT: the enricher already retries. Don't stack two retry layers.
    chat:
      client:
        enabled: true
      memory:
        repository:
          jdbc:
            initialize-schema: never
    ollama:
      base-url: ${OLLAMA_BASE_URL}
      chat:
        model: ${OLLAMA_CHAT_MODEL}
        options:
          temperature: 0.2
          max-completion-tokens: 2048
    openai:
      api-key: ${CHAT_KEY}
      base-url: ${CHAT_BASE_URL}
      chat:
        model: ${CHAT_MODEL}
        temperature: 0.2
        max-completion-tokens: 2048
      embedding:
        api-key: ${EMBEDDING_KEY}
        base-url: ${EMBEDDING_BASE_URL}
        model: ${EMBEDDING_MODEL}
        dimensions: 2048
      timeout: 120s
      rewrite:
        api-key: ${REWRITE_KEY}
        base-url: ${REWRITE_BASE_URL}
        chat:
          model: ${REWRITE_MODEL}
          temperature: 0.1
          max-tokens: 512
      enrich:
        api-key: ${ENRICH_KEY}
        base-url: ${ENRICH_BASE_URL}
        chat:
          model: ${ENRICH_MODEL}
          temperature: 0.2
          max-tokens: 256
    # SafeGuard Configuration
    advisor:
      safeguard:
        blocked-words:
          - env
    # Vector DB Configuration
    vectorstore:
      qdrant:
        host: ${QDRANT_HOST}
        port: ${QDRANT_PORT}
        api-key: ${QDRANT_API_KEY}
        collection-name: ${QDRANT_COLLECTION_NAME}
        content-field-name: ${QDRANT_CONTENT_FIELD_NAME}
        use-tls: ${QDRANT_USE_TLS}
        initialize-schema: true
  # Multi-Part File Configuration
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 50MB
# RAG Configuration
rag:
  chunking:
    chunk-size: 400
    min-chunk-size-chars: 100
    min-chunk-length-to-embed: 10
    max-num-chunks: 5000
    keep-separator: true
  retrieval:
    top-k: 5
    candidate-k: 20
    similarity-threshold: 0.70
# JWT Token Configuration
security:
  accessToken:
    expiration: 900
  refreshToken:
    expiration: 86400
  token:
    issuer: docmind
  cookie:
    name:
      refreshTokenName: refreshToken
      accessTokenName: accessToken
    cookieHttpOnly: ${COOKIE_HTTP_ONLY}
    cookieSecure: ${COOKIE_SECURE}
    cookieSameSite: ${COOKIE_SAME_SITE}
    cookieDomain: ${COOKIE_DOMAIN}
  # Keys Configuration
  keys:
    privateKeyPath: ${PRIVATE_KEY_PATH}
    publicKeyPath: ${PUBLIC_KEY_PATH}
# DocMind Default Credentials and Cors Configuration
docmind:
  enrich:
    # per-request defaults (client can override)
    enabled: true
    chunks-per-request: 5
    max-attempts: 3
    max-content-chars: 800
    skip-if-meaningful: true
    call-timeout-seconds: 30
    total-timeout-seconds: 600
    # global protection (client can NOT override)
    max-concurrency: 8
    requests-per-second: 10
    initial-backoff-ms: 500
    max-backoff-ms: 10000
    breaker-failure-threshold: 5
    breaker-open-seconds: 30
  default:
    credential:
      username: ${DEFAULT_ADMIN_USERNAME}
      password: ${DEFAULT_ADMIN_PASSWORD}
  cors:
    allowed-origins:
      - ${CORS_ALLOWED_ORIGIN}
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
      - PATCH
      - HEAD
    allowed-headers:
      - Content-Type
      - X-API-Version
      - X-Conversation-ID
      - Accept
      - Origin
      - Access-Control-Request-Method
      - Access-Control-Request-Headers
    allow-credentials: true
# Swagger Configuration
springdoc:
  default-produces-media-type: application/json
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
# Logging Configuration
logging:
  file:
    name: ${LOG_PATH}
  level:
    root: ${LOG_LEVEL_ROOT}
    com.pranit.docmind: ${DOCMIND_LOG_LEVEL}
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_PATH}.%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 50MB
      total-size-cap: 1GB
      max-history: 30
      clean-history-on-start: false
# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include:
          - health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
info:
  app:
    name: docmind-intelligence-engine
    description: "DocMind: Multi-Format document ingestion, vector embeddings with Qdrant and hybrid conversational Q&A with Nvidia."
    version: "1.0.0"
